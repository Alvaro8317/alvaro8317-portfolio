version: 2
updates:
  # Las actions están fijadas por SHA; Dependabot las mantiene al día.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /src
    schedule:
      interval: weekly
    ignore:
      # Los tipos siguen al runtime de src/.nvmrc (Node 22); súbelos junto con el .nvmrc.
      - dependency-name: "@types/node"
        versions: [">=23"]
  # ci/cfn-lint.txt lleva hashes (uv pip compile); Dependabot lo regenera.
  - package-ecosystem: pip
    directory: /ci
    schedule:
      interval: weekly
